version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=futbol_TFG
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  #minio:
    #image: minio/minio
    #container_name: minio
    #environment:
     # MINIO_ROOT_USER: minioadmin
     # MINIO_ROOT_PASSWORD: minioadmin
    #volumes:
     # - minio_data:/data
    #ports:
     # - "9000:9000"
     # - "9001:9001"
    #command: server /data --console-address ":9001"
    
  backend:
      build:
        context: .
        dockerfile: ./docker/Dockerfile.backend
      container_name: fastapi_backend
      restart: always
      environment:
        DB_USER: root
        DB_PASS: root
        DB_HOST: db
        DB_PORT: 3306
        DB_NAME: futbol_TFG
        ML_MODEL_PATH: /app/modelos/random_forest/modelo_randomforest5.pkl
        SCALER_PATH: /app/modelos/random_forest/scaler_randomforest5.pkl # Asumiendo este es tu scaler
      ports:
        - "8000:8000"
      depends_on:
        - db
      volumes:
        - ./modelos/mlpclassifier:/app/modelos/mlpclassifier # Para que los cambios en ML se reflejen sin rebuild
        - ./data:/app/data # Para acceso a datasets si es necesario
        - ./backend:/app/backend # Montar la carpeta del backend
        - ./domain:/app/domain # Montar la carpeta de modelos ORM
        - ./infra:/app/infra # Montar infra/database, etc.


volumes:
  db_data: {}
  minio_data: {}
