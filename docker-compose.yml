version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=futbol_TFG
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d

    
  backend:
      build:
        context: .
        dockerfile: ./docker/Dockerfile.backend
      container_name: fastapi_backend
      restart: always
      environment:
        DB_USER: root
        DB_PASSWORD: root
        DB_HOST: db
        DB_PORT: 3306
        DB_NAME: futbol_TFG
        ML_MODEL_PATH: /app/modelos/mlpclassifier/modelo_mlp_final.pkl
        SCALER_PATH: /app/modelos/mlpclassifier/scaler_mlp_final.pkl
        EXPLAINER_PATH: /app/modelos/mlpclassifier/explainer_mlp_final.pkl
      ports:
        - "8000:8000"
      depends_on:
        - db
      volumes:
        - ./modelos/mlpclassifier:/app/modelos/mlpclassifier 
        - ./data:/app/data 
        - ./backend:/app/backend 
        - ./domain:/app/domain 
        - ./infra:/app/infra 


volumes:
  db_data: {}
  
